<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GreenLock</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='greenlock.png') }}">
  <style>
    :root {
      --bg: #1f3d2b;
      --accent: #8fd6a8;
      --accent-text: #10241a;
      --text: #eef5ef;
      --muted: #a9c7b2;
    }
    * { box-sizing: border-box; overflow-wrap: break-word; word-wrap: break-word; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      padding: 48px 20px;
      text-align: center;
    }
    .page { width: 100%; max-width: 420px; }
    .logo { width: 64px; height: 64px; border-radius: 18px; margin-bottom: 14px; }
    h1 { margin: 0 0 36px; font-size: 22px; font-weight: 700; letter-spacing: 0.02em; }
    p { margin: 0 0 20px; color: var(--muted); font-size: 16px; }
    #start-button, #finish-button {
      font-size: 1.15rem;
      font-weight: 700;
      padding: 16px 28px;
      border-radius: 16px;
      border: none;
      background: var(--accent);
      color: var(--accent-text);
      cursor: pointer;
      width: 100%;
      max-width: 320px;
    }
    #start-button:hover, #finish-button:hover { filter: brightness(1.05); }
    #countdown {
      font-size: clamp(32px, 9vw, 44px);
      font-weight: 700;
      margin: 8px 0 28px;
      letter-spacing: -0.01em;
    }
    #unlocked-message { font-size: 18px; font-weight: 600; color: var(--accent); }
    #message {
      margin-top: 1.5rem;
      font-size: 1.1rem;
      white-space: pre-wrap;
      color: var(--muted);
    }
    #status {
      margin-top: 1.5rem;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      font-size: 1.1rem;
      color: var(--muted);
    }
    .spinner {
      width: 1.3rem;
      height: 1.3rem;
      border: 0.2rem solid rgba(238, 245, 239, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="page">
    <img class="logo" src="{{ url_for('static', filename='greenlock.png') }}" alt="">
    <h1>GreenLock</h1>

    <div id="start-section">
      <p>Take a photo outside to start your outdoor break.</p>
      <button id="start-button">Start outdoor break</button>
    </div>

    <div id="progress-section" class="hidden">
      <p>Outdoor break in progress.</p>
      <div id="countdown"></div>
      <button id="finish-button" class="hidden">Finish outdoor break</button>
    </div>

    <div id="unlocked-section" class="hidden">
      <p id="unlocked-message"></p>
    </div>

    <input type="file" id="photo-input" accept="image/*" capture="environment" hidden>

    <div id="status">
      <div class="spinner"></div>
      <span>Checking with local AI...</span>
    </div>
    <div id="message"></div>
  </div>

  <script>
    const MAX_WIDTH = 1024;
    const JPEG_QUALITY = 0.85;

    const input = document.getElementById("photo-input");
    const startSection = document.getElementById("start-section");
    const startButton = document.getElementById("start-button");
    const progressSection = document.getElementById("progress-section");
    const countdownEl = document.getElementById("countdown");
    const finishButton = document.getElementById("finish-button");
    const unlockedSection = document.getElementById("unlocked-section");
    const unlockedMessage = document.getElementById("unlocked-message");
    const status = document.getElementById("status");
    const message = document.getElementById("message");

    let mode = null; // "start" or "end" - which endpoint the next photo goes to
    let countdownTimer = null;

    function showSection(section) {
      startSection.classList.add("hidden");
      progressSection.classList.add("hidden");
      unlockedSection.classList.add("hidden");
      section.classList.remove("hidden");
    }

    function formatTime(iso) {
      return new Date(iso).toLocaleTimeString();
    }

    // Counts down to canEndAt, then swaps the countdown text for the
    // "Finish outdoor break" button.
    function startCountdown(canEndAt) {
      clearInterval(countdownTimer);
      finishButton.classList.add("hidden");
      countdownEl.classList.remove("hidden");

      const target = new Date(canEndAt).getTime();

      function tick() {
        const remainingMs = target - Date.now();
        if (remainingMs <= 0) {
          clearInterval(countdownTimer);
          countdownEl.classList.add("hidden");
          finishButton.classList.remove("hidden");
          return;
        }
        const totalSeconds = Math.ceil(remainingMs / 1000);
        const mm = String(Math.floor(totalSeconds / 60)).padStart(2, "0");
        const ss = String(totalSeconds % 60).padStart(2, "0");
        countdownEl.textContent = `End photo allowed in ${mm}:${ss}`;
      }

      tick();
      countdownTimer = setInterval(tick, 1000);
    }

    // Draws the photo onto a canvas at a max width of 1024px (keeping aspect
    // ratio, never upscaling) and returns it as a small JPEG Blob.
    function resizeToJpeg(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, MAX_WIDTH / img.width);
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);

          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          canvas.toBlob(
            (blob) => (blob ? resolve(blob) : reject(new Error("Could not create image"))),
            "image/jpeg",
            JPEG_QUALITY
          );
          URL.revokeObjectURL(img.src);
        };
        img.onerror = () => reject(new Error("Could not load photo"));
        img.src = URL.createObjectURL(file);
      });
    }

    async function refreshBreakStatus() {
      const res = await fetch("/break/status", { cache: "no-store" });
      const data = await res.json();
      if (data.in_progress) {
        showSection(progressSection);
        startCountdown(data.can_end_at);
      } else {
        showSection(startSection);
      }
    }

    startButton.addEventListener("click", () => {
      mode = "start";
      input.click();
    });

    finishButton.addEventListener("click", () => {
      mode = "end";
      input.click();
    });

    input.addEventListener("change", async () => {
      const file = input.files[0];
      if (!file) return;

      message.textContent = "";
      status.style.display = "flex";

      try {
        const jpegBlob = await resizeToJpeg(file);
        const formData = new FormData();
        formData.append("photo", jpegBlob, "photo.jpg");

        const url = mode === "start" ? "/break/start" : "/break/end";
        const response = await fetch(url, { method: "POST", body: formData });
        const data = await response.json();

        if (!response.ok) {
          // Server is authoritative on timing - if we somehow asked too
          // early, re-sync with it instead of trusting our own countdown.
          message.textContent = `Error: ${data.error || "unknown error"}`;
          await refreshBreakStatus();
        } else if (mode === "start") {
          if (data.outdoor) {
            message.textContent = `✅ ${data.reason}`;
            showSection(progressSection);
            startCountdown(data.can_end_at);
          } else {
            message.textContent = `❌ ${data.reason}`;
          }
        } else if (mode === "end") {
          if (data.outdoor) {
            message.textContent = "";
            unlockedMessage.textContent = `Unlocked until ${formatTime(data.unlocked_until)}`;
            showSection(unlockedSection);
          } else {
            message.textContent = `❌ ${data.reason}`;
          }
        }
      } catch (err) {
        message.textContent = `Error: ${err.message}`;
      } finally {
        status.style.display = "none";
        input.value = "";
      }
    });

    refreshBreakStatus();
  </script>
</body>
</html>
