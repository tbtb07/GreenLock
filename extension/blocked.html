<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time's up – GreenLock</title>
  <style>
    :root {
      --bg: #1f3d2b;
      --panel: #264a34;
      --accent: #8fd6a8;
      --accent-soft: rgba(143, 214, 168, 0.14);
      --accent-text: #10241a;
      --text: #eef5ef;
      --muted: #a9c7b2;
      --border: rgba(238, 245, 239, 0.12);
      --error: #ff9a8a;
      --error-soft: rgba(255, 138, 122, 0.14);
    }
    * { box-sizing: border-box; overflow-wrap: break-word; word-wrap: break-word; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 16px 56px;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .page { max-width: 420px; margin: 0 auto; }
    .clock { text-align: center; margin-bottom: 24px; }
    .clock-time { font-size: clamp(52px, 15vw, 84px); font-weight: 300; letter-spacing: -0.02em; line-height: 1; }
    .clock-date { margin-top: 8px; color: var(--muted); font-size: 15px; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .logo { width: 40px; height: 40px; border-radius: 12px; }
    .brand-name {
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 13px;
      color: var(--accent);
    }
    .headline {
      text-align: center;
      margin: 0 0 10px;
      font-size: clamp(26px, 6vw, 34px);
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -0.01em;
    }
    .from { text-align: center; margin: 0 0 32px; color: var(--muted); font-size: 14px; }
    .from:empty { display: none; }
    .card {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px;
      margin-bottom: 20px;
      text-align: center;
    }
    .eyebrow {
      margin: 0 0 18px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    p { margin: 0 0 12px; }
    .muted { color: var(--muted); font-size: 14px; }
    .qr { display: block; margin: 0 auto; border-radius: 14px; background: #ffffff; padding: 10px; }
    .qr-caption { margin: 16px 0 18px; color: var(--muted); font-size: 14px; }
    .phone-link {
      display: inline-block;
      color: var(--accent);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      word-break: break-all;
    }
    .phone-link:hover { text-decoration: underline; }
    .notice {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      text-align: left;
    }
    .notice.offline { background: var(--error-soft); color: var(--error); }
    .notice.offline code { font-weight: 700; white-space: nowrap; }
    .notice.unlocked { background: var(--accent-soft); color: var(--accent); font-weight: 600; text-align: center; }
    .checking { margin-top: 16px; color: var(--muted); font-size: 13px; }
    .emergency-card { opacity: 0.88; padding: 22px 24px; }
    .emergency-card h2 {
      margin: 0 0 4px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }
    .emergency-card .muted { margin: 0 0 16px; font-size: 12px; }
    form { display: flex; gap: 8px; flex-wrap: wrap; }
    input[type="password"] {
      flex: 1 1 160px;
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.15);
      color: var(--text);
      font: inherit;
    }
    input[type="password"]::placeholder { color: var(--muted); }
    input[type="password"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: var(--accent-text);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.05); }
    button:disabled { opacity: 0.5; cursor: default; }
    .message { margin: 12px 0 0; font-size: 13px; min-height: 1.4em; text-align: left; }
    .message.error { color: var(--error); }
    .message.success { color: var(--accent); font-weight: 600; }
    .remaining { margin: 4px 0 0; color: var(--muted); font-size: 12px; text-align: left; }
    .remaining:empty { display: none; }
  </style>
</head>
<body>
  <div class="page">
    <div class="clock">
      <div id="clock" class="clock-time">--:--</div>
      <div id="clockDate" class="clock-date"></div>
    </div>

    <div class="brand">
      <img class="logo" src="icons/greenlock.png" alt="">
      <span class="brand-name">GreenLock</span>
    </div>

    <h1 class="headline">Locked. Go outside to unlock.</h1>
    <p class="from" id="fromText"></p>

    <section class="card" aria-labelledby="breakHeading">
      <p class="eyebrow" id="breakHeading">Unlock with an outdoor break</p>
      <div id="qrBox" hidden>
        <img class="qr" id="qrImage" alt="QR code to open the unlock page on your phone" width="180" height="180">
        <p class="qr-caption">Scan with your phone</p>
      </div>
      <a class="phone-link" id="phoneLink" href="#" target="_blank" rel="noopener" hidden></a>
      <p class="notice offline" id="offlineNotice" hidden>
        Start the GreenLock server on this laptop
        (<code>.venv/bin/python server/app.py</code>)
      </p>
      <p class="notice unlocked" id="unlockedNotice" role="status" hidden></p>
      <p class="checking" id="checkingText" aria-live="polite">Checking the server…</p>
    </section>

    <section class="card emergency-card" aria-labelledby="emergencyHeading">
      <h2 id="emergencyHeading">Emergency unlock</h2>
      <p class="muted">Only for real emergencies. Limited uses per day.</p>
      <form id="emergencyForm">
        <input type="password" id="passwordInput" placeholder="Emergency password"
               aria-label="Emergency password" autocomplete="off">
        <button type="submit" id="unlockButton">Unlock</button>
      </form>
      <p class="message" id="emergencyMessage" role="alert"></p>
      <p class="remaining" id="remainingText"></p>
    </section>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
